<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipra Pradhan - Video Editor Portfolio</title>
    <style>
        :root {
            --bright-green: #00ff00;
            --dark-bg: #000000;
        }

        body {
            background-color: var(--dark-bg);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .portfolio-image {
            width: 100%;
            height: auto;
            display: block;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-container {
            padding-bottom: 40px;
            text-align: center;
        }
        
        .button {
            display: inline-block;
            background: transparent;
            color: var(--bright-green);
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 10px 0 10px;
            border: 2px solid var(--bright-green);
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .button:hover {
            background: var(--bright-green);
            color: var(--dark-bg);
        }
    </style>
</head>
<body>

    <main>
        <div class="section-container">
            <img src="port 1.jpg" alt="Shipra Pradhan Video Editor Title Page" class="portfolio-image">
        </div>

        <div class="section-container">
            <img src="port 2.jpg" alt="Brand History - Adda Station, Dinkaap News, Kolkata Book Fair" class="portfolio-image">
        </div>

        <div class="section-container">
            <img src="port 3.jpg" alt="Work History - List of services including YouTube editing, thumbnail design, and animation" class="portfolio-image">
             <a href="https://www.youtube.com/watch?v=xrxNfM83vAM&list=PLD7J8XQ66DdRLTHA0Qk2uqjrrNiKFSzIt&pp=gAQB" target="_blank" class="button">Watch YouTube Edits</a>
        </div>
    </main>

</body>
</html>
